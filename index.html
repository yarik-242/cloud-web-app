<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud App | Cyber Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-card: #1e293b;
            --primary: #6366f1;
            --accent: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            min-height: 100vh;
        }

        /* 1. ВЕРХНЯЯ ПАНЕЛЬ */
        .nav-bar {
            display: none;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .user-info { display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .user-info span { color: var(--primary); }

        /* 2. ГЛАВНЫЙ ТАЙМЕР */
        .study-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.3);
            margin-bottom: 20px;
        }

        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
            margin: 15px 0;
        }

        /* 3. КНОПКИ СТАТУСОВ */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .status-btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .status-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.1); }
        .status-btn.active { border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }

        /* 4. ВКЛАДКИ (TABS) */
        .tabs-container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 6px;
            display: flex;
            margin-bottom: 20px;
        }

        .tab-trigger {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s;
        }

        .tab-trigger.active {
            background: var(--primary);
            color: white;
        }

        .tab-content { display: none; width: 100%; max-width: 500px; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }

        /* 5. ДОСТИЖЕНИЯ */
        .achievements-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .ach-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 16px;
            text-align: left;
            position: relative;
        }

        .ach-card.locked { opacity: 0.4; filter: grayscale(1); }
        .ach-card.locked::after { content: '🔒'; position: absolute; top: 10px; right: 10px; font-size: 0.8rem; }
        
        .ach-icon { font-size: 1.5rem; margin-bottom: 8px; display: block; }
        .ach-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; display: block; }
        .ach-desc { font-size: 0.75rem; color: var(--text-dim); line-height: 1.3; }

        /* 6. ЛЕНТА И ПОСТЫ */
        .post-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
            text-align: left;
        }

        .post-img { width: 100%; border-radius: 12px; margin-top: 10px; }
        
        .btn-send {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            margin-top: 10px;
            cursor: pointer;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Дополнительные стили для рейтинга */
        .rank-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            margin-bottom: 8px;
            border-radius: 12px;
        }

        .rank-info { display: flex; align-items: center; gap: 10px; }
        .rank-num { font-weight: 800; color: var(--text-dim); width: 25px; }
        .rank-points { color: var(--warning); font-weight: 700; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="card" id="authCard" style="background: var(--bg-card); text-align: center; padding: 40px; border-radius: 24px; max-width: 400px; width: 100%;">
        <h2 style="font-size: 2rem;">Cloud App ⚡</h2>
        <p style="color: var(--text-dim);">Твоя личная система продуктивности</p>
        <button class="btn-send" id="loginBtn" style="margin-top: 20px;">Войти через Google</button>
    </div>

    <div class="nav-bar" id="navBar">
        <div class="user-info" id="navUserProfile">👤 Загрузка...</div>
        <div class="nav-buttons" style="display: flex; gap: 10px;">
            <button id="logoutBtn" style="background: var(--danger); border: none; padding: 8px 12px; border-radius: 8px; color: white; cursor: pointer;">🚪 Выход</button>
        </div>
    </div>

    <div id="mainApp" style="display: none; width: 100%; max-width: 500px;">
        
        <div class="study-card">
            <div id="statusLabel" style="font-size: 0.9rem; color: var(--text-dim); font-weight: 600;">СЕЙЧАС ТЫ:</div>
            <div id="currentStatusText" style="font-size: 1.4rem; font-weight: 800; margin: 5px 0;">Загрузка...</div>
            <div class="timer-display" id="studyTimer">00:00:00</div>
            
            <div class="status-grid">
                <button class="status-btn" onclick="updateStatus('📚 Учусь', '#6366f1')">📚 Учусь</button>
                <button class="status-btn" onclick="updateStatus('☕ Кофе', '#f59e0b')">☕ Кофе</button>
                <button class="status-btn" onclick="updateStatus('🎮 В игре', '#10b981')">🎮 В игре</button>
                <button class="status-btn" onclick="updateStatus('🏠 Отдых', '#94a3b8')">🏠 Отдых</button>
            </div>
        </div>

        <div class="tabs-container">
            <button class="tab-trigger active" onclick="switchTab('participants')">Участники</button>
            <button class="tab-trigger" onclick="switchTab('rating')">Рейтинг</button>
            <button class="tab-trigger" onclick="switchTab('achievements')">Достижения</button>
        </div>

        <div id="participants" class="tab-content active">
            <div id="group-list"></div>
        </div>

        <div id="rating" class="tab-content">
            <div id="top-students-list"></div>
        </div>

        <div id="achievements" class="tab-content">
            <div class="achievements-grid" id="achievementsGrid">
                </div>
        </div>

        <div class="post-card" style="margin-top: 30px;">
            <h3 style="margin-top: 0;">Новый пост ✨</h3>
            <textarea id="postText" placeholder="Напиши что-нибудь..."></textarea>
            <input type="file" id="imageInput" accept="image/*" style="margin: 10px 0; font-size: 0.8rem; color: var(--text-dim);">
            <button class="btn-send" id="sendBtn">Опубликовать</button>
        </div>

        <div id="feed" style="margin-top: 20px;"></div>
    </div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, where, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const SUPABASE_URL = 'https://mvyybofgbevtdrjxakgz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_wOpOx1LKaZ5BeM3vhkeMUA_4ld7jrkP'; 
    const firebaseConfig = {
        apiKey: "AIzaSyCw3ttPKMx-jAd1IL-5IZRdA4KVAMYdSgA",
        authDomain: "projctick.firebaseapp.com",
        projectId: "projctick",
        storageBucket: "projctick.firebasestorage.app",
        messagingSenderId: "639615889635",
        appId: "1:639615889635:web:f591a1ebf29ae95e75d5d6"
    };

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const db = getFirestore(initializeApp(firebaseConfig));
    const storage = getStorage();

    let currentUser = null;
    let timerInterval = null;

    // 1. ВКЛАДКИ
    window.switchTab = (tabId) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    };

    // 2. АВТОРИЗАЦИЯ
    document.getElementById('loginBtn').onclick = () => supabase.auth.signInWithOAuth({ provider: 'google' });
    document.getElementById('logoutBtn').onclick = async () => {
        if (currentUser) await supabase.from('profiles').update({ is_online: false }).eq('id', currentUser.id);
        await supabase.auth.signOut();
        location.reload();
    };

    supabase.auth.onAuthStateChange(async (event, session) => {
        currentUser = session?.user;
        if (currentUser) {
            document.getElementById('authCard').style.display = 'none';
            document.getElementById('navBar').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('navUserProfile').innerHTML = `👤 <span>${currentUser.email.split('@')[0]}</span>`;
            
            initProfile();
            loadFeed();
            startGlobalTimer();
        }
    });

    // 3. ЛОГИКА ПРОФИЛЯ И АЧИВОК
    const achList = [
        { id: 'first', icon: '🌱', title: 'Первый шаг', desc: 'Начни свою первую учебную сессию' },
        { id: 'early', icon: '🌅', title: 'Ранняя пташка', desc: 'Зайди в приложение до 9:00 утра' },
        { id: 'marathon', icon: '🏃‍♂️', title: 'Марафонец', desc: 'Проучись более 2 часов за одну сессию' },
        { id: 'activist', icon: '🗣️', title: 'Душа компании', desc: 'Напиши более 20 постов в ленту' },
        { id: 'legend', icon: '👑', title: 'Легенда', desc: 'Накопи более 1000 минут учебы' }
    ];

    async function initProfile() {
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        if (!profile) {
            await supabase.from('profiles').insert({ id: currentUser.id, email: currentUser.email, points: 0, post_count: 0, badges: '' });
        }
        await supabase.from('profiles').update({ is_online: true }).eq('id', currentUser.id);
        
        // Проверка на Раннюю Пташку
        const hr = new Date().getHours();
        if (hr < 9) await addBadge('early');

        fetchData();
    }

    async function addBadge(badgeId) {
        const { data } = await supabase.from('profiles').select('badges').eq('id', currentUser.id).single();
        let badges = data?.badges || '';
        if (!badges.includes(badgeId)) {
            await supabase.from('profiles').update({ badges: badges + (badges ? ',' : '') + badgeId }).eq('id', currentUser.id);
        }
    }

    // 4. ТАЙМЕРЫ И СТАТУСЫ
    window.updateStatus = async (status, color) => {
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
        
        let updates = { status, color };
        
        if (profile.status === '📚 Учусь' && status !== '📚 Учусь') {
            const diff = Math.floor((Date.now() - profile.study_start) / 60000);
            if (diff > 0) {
                updates.points = (profile.points || 0) + diff;
                if (diff >= 120) await addBadge('marathon');
                if ((profile.points + diff) >= 1000) await addBadge('legend');
            }
            updates.study_start = null;
        }

        if (status === '📚 Учусь') {
            updates.study_start = Date.now();
            await addBadge('first');
        }

        await supabase.from('profiles').update(updates).eq('id', currentUser.id);
        fetchData();
    };

    function startGlobalTimer() {
        setInterval(() => {
            const timerEl = document.getElementById('studyTimer');
            // Здесь можно добавить логику тикающего таймера текущей сессии
        }, 1000);
    }

    async function fetchData() {
        const { data: users } = await supabase.from('profiles').select('*');
        if (!users) return;

        // Рендер участников
        document.getElementById('group-list').innerHTML = users.map(u => `
            <div class="rank-item">
                <div class="rank-info">
                    <div class="supa-dot" style="background:${u.is_online ? '#2ecc71':'#475569'}"></div>
                    <b>${u.email.split('@')[0]}</b>
                </div>
                <div style="font-size:0.8rem; color:var(--text-dim)">${u.status || 'Нет статуса'}</div>
            </div>
        `).join('');

        // Рендер рейтинга
        const sorted = [...users].sort((a,b) => (b.points||0) - (a.points||0));
        document.getElementById('top-students-list').innerHTML = sorted.map((u, i) => `
            <div class="rank-item">
                <div class="rank-info">
                    <div class="rank-num">${i+1}</div>
                    <b>${u.email.split('@')[0]}</b>
                </div>
                <div class="rank-points">${u.points || 0} мин.</div>
            </div>
        `).join('');

        // Рендер достижений (Locked/Unlocked)
        const me = users.find(u => u.id === currentUser.id);
        const myBadges = me?.badges.split(',') || [];
        
        document.getElementById('achievementsGrid').innerHTML = achList.map(a => `
            <div class="ach-card ${myBadges.includes(a.id) ? '' : 'locked'}">
                <span class="ach-icon">${a.icon}</span>
                <span class="ach-title">${a.title}</span>
                <span class="ach-desc">${a.desc}</span>
            </div>
        `).join('');

        document.getElementById('currentStatusText').innerText = me?.status || 'Не в сети';
        document.getElementById('currentStatusText').style.color = me?.color || 'white';
    }

    // 5. ЛЕНТА
    async function loadFeed() {
        const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snaps) => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snaps.forEach(d => {
                const p = d.data();
                feed.innerHTML += `
                    <div class="post-card">
                        <div style="font-weight:700; font-size:0.9rem; color:var(--primary);">${p.name}</div>
                        <div style="margin-top:10px; line-height:1.4;">${p.text || ''}</div>
                        ${p.imageUrl ? `<img src="${p.imageUrl}" class="post-img">` : ''}
                    </div>
                `;
            });
        });
    }

    document.getElementById('sendBtn').onclick = async () => {
        const text = document.getElementById('postText').value;
        const file = document.getElementById('imageInput').files[0];
        let url = null;
        
        if (file) {
            const sRef = ref(storage, `posts/${Date.now()}_${file.name}`);
            await uploadBytes(sRef, file);
            url = await getDownloadURL(sRef);
        }

        await addDoc(collection(db, "requests"), {
            name: currentUser.email.split('@')[0],
            text, imageUrl: url, timestamp: serverTimestamp()
        });

        // Проверка на ачивку "Активист"
        const { data: profile } = await supabase.from('profiles').select('post_count').eq('id', currentUser.id).single();
        const newCount = (profile.post_count || 0) + 1;
        await supabase.from('profiles').update({ post_count: newCount }).eq('id', currentUser.id);
        if (newCount >= 20) await addBadge('activist');

        document.getElementById('postText').value = "";
    };

    // Запуск обновлений каждые 30 сек
    setInterval(fetchData, 30000);
</script>
</body>
</html>
